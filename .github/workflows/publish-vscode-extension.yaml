name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example vscode/v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "vscode/v*.*.*"

env:
  TAG_NAME: ""
  VERSION: ""

jobs:
  publish-vscode:
    name: Publish VS Code Extension
    environment: vscode-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: vscode

    steps:
      - name: Validate requested release tag before checkout
        id: release_tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^vscode/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a namespaced stable extension tag: vscode/vX.Y.Z" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout editor repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Resolve release tag and version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          tag_name="$REQUESTED_TAG"

          if [[ ! "$tag_name" =~ ^vscode/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vscode/v1.0.0. Got: $tag_name" >&2
            exit 1
          fi

          version_from_tag="${tag_name#vscode/v}"
          version_from_pkg="$(node -p "require('./package.json').version")"
          if [ "$version_from_tag" != "$version_from_pkg" ]; then
            echo "Tag version ($version_from_tag) does not match vscode/package.json version ($version_from_pkg)." >&2
            exit 1
          fi

          echo "VERSION=$version_from_tag" >> "$GITHUB_ENV"
          echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"

      - name: Lint extension
        run: npm run lint

      - name: Checkout audited Setup Action (push dependency first)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: fidan-lang/fidan-actions
          ref: a1800c42f9fba633b78ab6a96c204952ebca5ff5
          path: audited-setup
          persist-credentials: false
      - name: Read exact compiler candidate contract
        id: candidate
        run: node ../audited-setup/scripts/verify-candidate.mjs ../ci/compiler-candidate.json ../audited-setup
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: fidan-lang/fidan
          ref: ${{ steps.candidate.outputs.compiler_sha }}
          path: compiler
          persist-credentials: false
      - run: node ../audited-setup/scripts/verify-candidate.mjs ../ci/compiler-candidate.json ../audited-setup ../compiler
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --manifest-path ../compiler/Cargo.toml -p fidan-cli --release --locked
      - name: Audited installer and workflow security regressions
        run: |
          node ../audited-setup/scripts/check-built-candidate.mjs ../compiler/target/release/fidan
          python -m pip install PyYAML==6.0.3
          python ../audited-setup/scripts/check-workflows.py .. ../audited-setup
      - name: Compatibility regression check against exact candidate
        run: npm run check:compatibility
        env:
          FIDAN_BIN: ${{ github.workspace }}/compiler/target/release/fidan

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        shell: bash
        run: |
          mkdir -p ../artifacts
          npx @vscode/vsce package --out "../artifacts/fidan-${VERSION}.vsix"

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "Missing required secret: VSCE_PAT" >&2
            exit 1
          fi
          npx @vscode/vsce publish --packagePath "../artifacts/fidan-${VERSION}.vsix" -p "$VSCE_PAT"

      - name: Create GitHub release and upload VSIX
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Fidan VS Code ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/fidan-${{ env.VERSION }}.vsix
